services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tractian-ml-engineering-llm
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Logging configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_NAME=${API_NAME:-tractian-ml-engineering-llm}

      # Application settings
      - PYTHONUNBUFFERED=1

    volumes:
      # Persist vector store (using named volume)
      - chroma-db:/app/chroma_db

      # Persist database file (using named volume)
      - tractian-db:/app/db_data

      # Logs
      - ./logs:/app/logs

    env_file:
      - .env

    networks:
      - tractian-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  tractian-network:
    driver: bridge

volumes:
  tractian-db:
    driver: local
  chroma-db:
    driver: local
